name: Build and Release sagelite

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            recipe: recipes/environment.x86_64.yml
            artifact_name: sagemath-portable-x86_64.tar.zst
          - arch: aarch64
            os: ubuntu-24.04-arm
            recipe: recipes/environment.aarch64.yml
            artifact_name: sagemath-portable-aarch64.tar.zst

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Micromamba Package Downloads
        uses: actions/cache@v4
        with:
          path: ~/.micromamba/pkgs
          key: micromamba-${{ matrix.arch }}-${{ hashFiles(matrix.recipe) }}
          restore-keys: |
            micromamba-${{ matrix.arch }}-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd tar bzip2 curl

      - name: Build Portable Distribution
        run: |
          ./scripts/build.sh "${{ matrix.recipe }}" "artifacts/${{ matrix.artifact_name }}"

      - name: Relocation & Verification Testing
        run: |
          mkdir -p /tmp/test-extract
          tar --zstd -xf "artifacts/${{ matrix.artifact_name }}" -C /tmp/test-extract
          
          # Test directory relocation
          mv /tmp/test-extract /tmp/test-relocated
          
          # Execute verification suite from relocated path
          ./scripts/test.sh /tmp/test-relocated/sage

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sagelite-${{ matrix.arch }}
          path: |
            artifacts/${{ matrix.artifact_name }}
            artifacts/${{ matrix.artifact_name }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tar.zst
            release-artifacts/*.sha256
            scripts/install.sh
          generate_release_notes: true
          draft: false
          prerelease: false
